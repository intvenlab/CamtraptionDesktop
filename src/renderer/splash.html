<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Camtraption Desktop</title>
    <!-- Transparent, frameless startup window (see createSplash in src/main/index.ts). No scripts:
         the main process fills #status (scan progress) through executeJavaScript.
         Artwork: img/CamtrationDesktopLogo2.png (already transparent), downscaled to 2x display size. -->
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        animation: appear 0.35s ease-out both;
      }
      img { width: 520px; height: auto; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45)); }
      .status {
        font: 600 14px 'Segoe UI', system-ui, sans-serif; color: #cfe2ff; min-height: 20px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.8);
      }
      .bar { width: 220px; height: 4px; border-radius: 2px; background: rgba(11, 13, 16, 0.6); overflow: hidden; }
      .bar > div { width: 35%; height: 100%; border-radius: 2px; background: #3d8bfd; animation: slide 1.1s infinite ease-in-out; }
      @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
      @keyframes appear { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <img src="./src/assets/splash.png" alt="Camtraption Desktop" />
    <div class="status" id="status">Starting…</div>
    <div class="bar"><div></div></div>
  </body>
</html>
